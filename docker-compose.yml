networks:
  vibecheck_network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibecheck
      POSTGRES_PASSWORD: vibecheck
      POSTGRES_DB: vibecheck
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vibecheck_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecheck -d vibecheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - vibecheck_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - vibecheck_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vibecheck:vibecheck@postgres:5432/vibecheck
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      PORT: 8000
      REDIS_HOST: redis
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibecheck_network

  inngest:
    image: inngest/inngest:latest
    container_name: inngest
    ports:
      - "8288:8288"
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest"]
    depends_on:
      - api
    networks:
      - vibecheck_network

  socket:
    build:
      context: .
      dockerfile: apps/socket/Dockerfile
    container_name: socket
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vibecheck_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SOCKET_URL: ""
    depends_on:
      - api
      - socket
    networks:
      - vibecheck_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - socket
    networks:
      - vibecheck_network

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  caddy_data:
  caddy_config: