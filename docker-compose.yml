networks:
  vibecheck_network:
    driver: bridge
  edge:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibecheck
      POSTGRES_PASSWORD: vibecheck
      POSTGRES_DB: vibecheck
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vibecheck_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecheck -d vibecheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - vibecheck_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - vibecheck_network

  api:
    image: ${DOCKERHUB_USERNAME}/vibecheck-api:${TAG:-latest}
    pull_policy: always
    container_name: api
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ./env/api.env
    environment:
      DATABASE_URL: postgresql://vibecheck:vibecheck@postgres:5432/vibecheck
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      PORT: 8000
      REDIS_HOST: redis
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibecheck_network

  inngest:
    image: inngest/inngest:latest
    container_name: inngest
    expose:
      - "8288"
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest"]
    depends_on:
      - api
    networks:
      - vibecheck_network

  socket:
    image: ${DOCKERHUB_USERNAME}/vibecheck-socket:${TAG:-latest}
    pull_policy: always
    container_name: socket
    expose:
      - "8080"
    restart: unless-stopped
    env_file:
      - ./env/socket.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vibecheck_network

  web:
    image: ${DOCKERHUB_USERNAME}/vibecheck-web:${TAG:-latest}
    pull_policy: always
    container_name: web
    expose:
      - "3000"
    restart: unless-stopped
    env_file:
      - ./env/web.env
    depends_on:
      - api
      - socket
    networks:
      - vibecheck_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - socket
    networks:
      - vibecheck_network
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.vibecheck.rule=Host(`vibecheck.manasx.online`)"
      - "traefik.http.routers.vibecheck.entrypoints=websecure"
      - "traefik.http.routers.vibecheck.tls=true"
      - "traefik.http.routers.vibecheck.tls.certresolver=le"
      - "traefik.http.services.vibecheck.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  caddy_data:
  caddy_config: