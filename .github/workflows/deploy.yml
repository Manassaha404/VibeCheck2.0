name: Build, Push, Deploy

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, socket]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://vibecheck.manasx.online
            NEXT_PUBLIC_SOCKET_URL=https://vibecheck.manasx.online
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vibecheck-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vibecheck-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=vibecheck-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vibecheck-${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/vibecheck"

      - name: Write env files on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_ENV_FILE,SOCKET_ENV_FILE,WEB_ENV_FILE
          script: |
            mkdir -p ~/vibecheck/env
            cat > ~/vibecheck/env/api.env << 'EOF'
            ${{ secrets.API_ENV_FILE }}
            EOF
            cat > ~/vibecheck/env/socket.env << 'EOF'
            ${{ secrets.SOCKET_ENV_FILE }}
            EOF
            cat > ~/vibecheck/env/web.env << 'EOF'
            ${{ secrets.WEB_ENV_FILE }}
            EOF
            chmod 600 ~/vibecheck/env/*.env

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/vibecheck
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export TAG=${{ github.sha }}
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # Pull the latest images and force recreation to avoid stale local cache
            docker compose pull
            docker compose up -d --force-recreate
            
            # Wait a few seconds to ensure postgres is ready to accept connections
            sleep 5
            
            docker image prune -a -f